<div class="modal fade modal-carrito-derecha" id="carritoModal" tabindex="-1" aria-hidden="true" aria-labelledby="carritoModalLabel">
    <div class="modal-dialog">
        <div class="modal-content">
            
            <!-- Encabezado del Modal -->
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="carritoModalLabel">Tu Pedido</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Cuerpo del Modal (Productos y Totales) -->
            <div class="modal-body">
                <!-- Se inyectan los productos -->
                <div id="listaCarrito" aria-live="polite"></div>

                <!-- Total -->
                <div class="d-flex justify-content-between align-items-center fw-bold mt-3 mb-2">
                    <span>Total</span>
                    <span id="totalCarrito">$0.00</span>
                </div>   

                <!-- Botón Pagar -->
                <button type="button" class="btn btn-pagar w-100 py-3 fw-bold rounded-pill mb-3">
                    <i class="bi bi-bag-check-fill me-2"></i> Pagar
                </button>

            </div>

        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registro Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!--  <link href="https://googleapis.com" rel="stylesheet">  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/registroUsu.css">

</head>

<body>
    <div id="mochiNav">
        <main class="register-container">
            <div class="register-card">

                <!-- Columna Izquierda: Branding y Bienvenida -->
                <section class="col-brand">
                    <div class="brand-circle">
                        <img src="../assets/imagenes/iconos/logos/LogoBlanco.png" alt="MochiMexa Logo"
                            class="brand-logo">
                    </div>
                    <h2 class="brand-title">¡Únete a la familia!</h2>
                    <p class="brand-description">
                        Crea tu cuenta y descubre el lado más dulce del intercambio cultural entre Japón y México.
                    </p>
                </section>

                <!-- Columna Derecha: Formulario de Registro -->
                <section class="col-form">
                    <header class="form-header">
                        <h1>Registrarse</h1>
                        <p>Unete al universo MochiMexa y no te pierdas nuestras promociones exclusivas.</p>
                    </header>

                    <form id="registroForm" class="register-form" action="#" method="POST">

                        <!-- Campo: Nombre Completo -->
                        <div class="form-group">
                            <label for="name">Nombre completo</label>
                            <div class="input-wrapper">
                                <span class="input-icon" aria-hidden="true">
                                    <img src="../assets/imagenes/iconos/user-solid.png" alt="icono mail">
                                </span>
                                <input type="text" id="name" name="name" placeholder="Ej. Sakura Garcia" required>
                            </div>
                        </div>

                        <!-- Campo: Correo Electrónico -->
                        <div class="form-group">
                            <label for="email">Correo electrónico</label>
                            <div class="input-wrapper">
                                <span class="input-icon" aria-hidden="true">
                                    <img src="../assets/imagenes/iconos/envelope-solid.png" alt="icono email">
                                </span>
                                <input type="email" id="email" name="email" placeholder="hola@ejemplo.com" required>
                            </div>
                        </div>

                        <!--Campo Telefono-->
                        <div class="form-group">
                            <label for="phone">Numero de teléfono</label>
                            <div class="input-wrapper">
                                <span class="input-icon" aria-hidden="true"> 
                                    <img src="../assets/imagenes/iconos/phone-solid.png" alt="icono telefono">
                                </span>
                                <input type="tel" id="phone" name="phone" placeholder="55 5555 5555" required>
                            </div>
                        </div>

                        <!-- Campo: Contraseña -->
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <div class="input-wrapper">
                                <span class="input-icon" aria-hidden="true">
                                    <img src="../assets/imagenes/iconos/lock-solid.png" alt="icono candado">
                                </span>
                                <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" placeholder="••••••••" required>
                                <button type="button" class="toggle-password" onclick="togglePasswordVista()"
                                    aria-label="Mostrar u ocultar contraseña">
                                    <img id="ojo" src="../assets/imagenes/iconos/eye-slash-solid.png"
                                        alt="icono de visión">
                                </button>
                            </div>
                        </div>
                        <!-- Campo: Confirmar Contraseña -->
                            <div class="form-group">
                            <label for="passwordConfirm">Confirmar Contraseña</label>
                            <div class="input-wrapper">
                                <span class="input-icon" aria-hidden="true">
                                    <img src="../assets/imagenes/iconos/lock-solid.png" alt="icono candado">
                                </span>
                                <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="••••••••" required>
                                <button type="button" class="toggle-password" onclick="toggleConfirmPasswordVista()"
                                    aria-label="Mostrar u ocultar contraseña">
                                    <img id="ojoConfirm" src="../assets/imagenes/iconos/eye-slash-solid.png"
                                        alt="icono de visión">
                                </button>
                            </div>
                        </div>                       

                        <!-- Checkbox: Términos y Condiciones -->
                        <div class="form-checkbox">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">
                                Acepto los <span class="highlight-text">
                                    <a href="contactanos.html?asunto=terminos#formTeam" target="_blank" rel="noopener">Terminos y Condiciones</a></span>
                            </label>
                        </div>

                        <!-- Botón de Envío -->
                        <button type="submit" class="btn btn-submit text-white fw-bold py-3 w-100 rounded-pill">Registrarse</button>
                    </form>
                </section>

            </div>
        </main>
        <script src="../js/mochi.js"></script>
        <script src="../js/registroUsu.js"></script>
</body>

</html>
